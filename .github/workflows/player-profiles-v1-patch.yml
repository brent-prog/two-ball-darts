name: Player Profiles V1 Fix

on:
  push:
    branches: [player-profiles-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-profiles-v1

      - name: Fix profile integration
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/page.jsx')
          s = p.read_text()

          replacements = [
            ("{ id: 'p1', playerId: null, name: 'Player 1', scores: {} },\n  { id: 'p2', playerId: null, name: 'Player 2', scores: {} }", "{ id: 'p1', playerId: null, isProfile: false, name: 'Player 1', scores: {} },\n  { id: 'p2', playerId: null, isProfile: false, name: 'Player 2', scores: {} }"),
            ("playerId: row.player_id || row.players?.id || null,\n      name: row.players?.display_name || `Player ${index + 1}`,", "playerId: row.player_id || row.players?.id || null,\n      isProfile: Boolean(row.players?.is_profile),\n      name: row.players?.display_name || `Player ${index + 1}`,"),
            ("readOnly={Boolean(player.playerId)} title={player.playerId ? 'Saved player profile' : 'Guest player'} onFocus={event => { if (!player.playerId) event.target.select(); }} onChange={event => { if (!player.playerId) updateName(player.id, event.target.value); }}", "readOnly={Boolean(player.isProfile)} title={player.isProfile ? 'Saved player profile' : 'Guest player'} onFocus={event => { if (!player.isProfile) event.target.select(); }} onChange={event => { if (!player.isProfile) updateName(player.id, event.target.value); }}"),
            ("function updateName(playerId, name) { markRoundDirty(); setPlayers(current => current.map(player => player.id === playerId && !player.playerId ? { ...player, name } : player)); }", "function updateName(playerId, name) { markRoundDirty(); setPlayers(current => current.map(player => player.id === playerId && !player.isProfile ? { ...player, name, playerId: null } : player)); }"),
            ("function addGuest() { markRoundDirty(); setPlayers(current => [...current, { id: crypto.randomUUID(), playerId: null, name: `Player ${current.length + 1}`, scores: {} }]); }", "function addGuest() { markRoundDirty(); setPlayers(current => [...current, { id: crypto.randomUUID(), playerId: null, isProfile: false, name: `Player ${current.length + 1}`, scores: {} }]); }"),
            ("setPlayers(current => current.some(player => player.playerId === profile.id) ? current : [...current, { id: crypto.randomUUID(), playerId: profile.id, name: profile.display_name, scores: {} }]);\n    markRoundDirty();", "setPlayers(current => {\n      if (current.some(player => player.playerId === profile.id)) return current;\n      const placeholderIndex = current.findIndex(player => !player.playerId && !player.isProfile && scoredHoleCount(player) === 0 && /^Player \\d+$/.test(player.name));\n      if (placeholderIndex >= 0) return current.map((player, index) => index === placeholderIndex ? { ...player, playerId: profile.id, isProfile: true, name: profile.display_name, scores: {} } : player);\n      return [...current, { id: crypto.randomUUID(), playerId: profile.id, isProfile: true, name: profile.display_name, scores: {} }];\n    });\n    markRoundDirty();"),
            ("players(id,display_name),hole_scores", "players(id,display_name,is_profile),hole_scores"),
            ("<PlayerProfilesModal open={showPlayerProfiles} onClose={() => setShowPlayerProfiles(false)} onSelectProfile={addSavedProfile} onAddGuest={addGuest} activePlayerIds={players.map(player => player.playerId).filter(Boolean)} />}{scoringPlayer", "<PlayerProfilesModal open={showPlayerProfiles} onClose={() => setShowPlayerProfiles(false)} onSelectProfile={addSavedProfile} onAddGuest={addGuest} activePlayerIds={players.map(player => player.playerId).filter(Boolean)} />{scoringPlayer")
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected source fragment: {old[:120]}')
            s = s.replace(old, new)

          p.write_text(s)

      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.jsx
          git commit -m "Fix player profiles integration and verify build"
          git push origin player-profiles-v1
