name: Player Selection UX Polish

on:
  push:
    branches: [player-profiles-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-profiles-v1

      - name: Polish player selection UI
        shell: python
        run: |
          from pathlib import Path
          page = Path('src/app/page.jsx')
          s = page.read_text()

          old = '''function PlayerScoringRow({ player, result, totalScore, isLeader, hasHonours, openScore, updateName, choosePlayer }) {
  const scored = Boolean(result);
  const scoreLabel = scored ? `${result.label} ${fmt(result.score)}` : 'No score yet';
  const buttonLabel = scored ? `${result.label} ${fmt(result.score)}` : 'Add Score';
  const badgeClasses = ['tbd-player-total-score'];'''
          new = '''function PlayerScoringRow({ player, result, totalScore, isLeader, hasHonours, openScore, updateName, choosePlayer }) {
  const scored = Boolean(result);
  const hasPlayer = Boolean(player.isProfile || player.isGuest);
  const scoreLabel = scored ? `${result.label} ${fmt(result.score)}` : hasPlayer ? 'No score yet' : 'Select a player to begin';
  const buttonLabel = scored ? `${result.label} ${fmt(result.score)}` : 'Add Score';
  const badgeClasses = ['tbd-player-total-score'];'''
          if old not in s: raise SystemExit('PlayerScoringRow header not found')
          s = s.replace(old, new, 1)

          old = '''return <div className={`tbd-player-score-row ${scored ? 'scored' : ''} ${hasHonours ? 'has-honours' : ''}`}>'''
          new = '''return <div className={`tbd-player-score-row ${scored ? 'scored' : ''} ${hasHonours ? 'has-honours' : ''} ${hasPlayer ? '' : 'needs-player'}`}>'''
          if old not in s: raise SystemExit('player row class not found')
          s = s.replace(old, new, 1)

          old = '''{player.isProfile ? <input className="tbd-player-name-input" aria-label={`${player.name} saved profile`} value={player.name} readOnly title="Saved player profile" /> : player.isGuest ? <input className="tbd-player-name-input" aria-label={`${player.name} guest name`} value={player.name} title="Guest player" onFocus={event => event.target.select()} onChange={event => updateName(player.id, event.target.value)} /> : <button type="button" className="tbd-player-name-input" onClick={() => choosePlayer(player.id)} style={{ textAlign: 'left', cursor: 'pointer' }} aria-label={`Choose ${player.name}`}>{player.name} · Choose player</button>}'''
          new = '''{player.isProfile ? <input className="tbd-player-name-input" aria-label={`${player.name} saved profile`} value={player.name} readOnly title="Saved player profile" /> : player.isGuest ? <input className="tbd-player-name-input" aria-label={`${player.name} guest name`} value={player.name} title="Guest player" onFocus={event => event.target.select()} onChange={event => updateName(player.id, event.target.value)} /> : <button type="button" className="tbd-player-select-card" onClick={() => choosePlayer(player.id)} aria-label={`Choose ${player.name}`}><span className="tbd-player-select-slot">{player.name}</span><span className="tbd-player-select-title">Choose Player</span><span className="tbd-player-select-help">Saved profile or guest</span></button>}'''
          if old not in s: raise SystemExit('player chooser markup not found')
          s = s.replace(old, new, 1)

          old = '''<button className="button secondary" onClick={() => openScore(player.id)}>{buttonLabel}</button>'''
          new = '''<button className="button secondary" disabled={!hasPlayer} onClick={() => openScore(player.id)}>{buttonLabel}</button>'''
          if old not in s: raise SystemExit('score button not found')
          s = s.replace(old, new, 1)

          page.write_text(s)

          css = Path('src/app/player-row-overrides.css')
          c = css.read_text()
          marker = '/* Player profile selection polish */'
          block = r'''

/* Player profile selection polish */
.tbd-player-score-row.needs-player .tbd-player-name-line::before{
  display:none!important;
}

.tbd-player-select-card{
  grid-column:2 / 4!important;
  grid-row:1!important;
  width:100%!important;
  min-width:0!important;
  min-height:52px!important;
  display:grid!important;
  grid-template-columns:auto minmax(0,1fr)!important;
  grid-template-rows:auto auto!important;
  column-gap:10px!important;
  row-gap:1px!important;
  align-items:center!important;
  margin:0!important;
  padding:7px 11px!important;
  border:2px solid rgba(208,169,72,.72)!important;
  border-radius:14px!important;
  background:linear-gradient(135deg,rgba(208,169,72,.10),rgba(2,20,15,.92))!important;
  color:#fff4d6!important;
  text-align:left!important;
  cursor:pointer!important;
  box-shadow:none!important;
}

.tbd-player-select-slot{
  grid-column:1!important;
  grid-row:1 / 3!important;
  display:grid!important;
  place-items:center!important;
  min-width:48px!important;
  height:34px!important;
  padding:0 8px!important;
  border-radius:999px!important;
  background:#d0a948!important;
  color:#02140f!important;
  font-size:.7rem!important;
  font-weight:1000!important;
  letter-spacing:.05em!important;
  text-transform:uppercase!important;
  white-space:nowrap!important;
}

.tbd-player-select-title{
  grid-column:2!important;
  grid-row:1!important;
  min-width:0!important;
  color:#fff4d6!important;
  font-size:1rem!important;
  font-weight:1000!important;
  line-height:1.05!important;
}

.tbd-player-select-help{
  grid-column:2!important;
  grid-row:2!important;
  min-width:0!important;
  color:rgba(255,244,214,.68)!important;
  font-size:.72rem!important;
  font-weight:800!important;
  line-height:1.05!important;
}

.tbd-player-score-row.needs-player > button.button{
  opacity:.38!important;
  filter:saturate(.45)!important;
  cursor:not-allowed!important;
}

.tbd-player-score-row.needs-player .tbd-hole-status{
  color:rgba(208,169,72,.76)!important;
  font-family:inherit!important;
  font-style:normal!important;
  font-size:.78rem!important;
  font-weight:900!important;
  letter-spacing:.02em!important;
}

@media(max-width:520px){
  .tbd-player-select-card{
    min-height:48px!important;
    padding:6px 8px!important;
    column-gap:8px!important;
  }

  .tbd-player-select-slot{
    min-width:42px!important;
    height:30px!important;
    padding:0 7px!important;
    font-size:.62rem!important;
  }

  .tbd-player-select-title{
    font-size:.92rem!important;
  }

  .tbd-player-select-help{
    font-size:.66rem!important;
  }
}
'''
          if marker not in c:
            css.write_text(c + block)

      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.jsx src/app/player-row-overrides.css
          git commit -m "Polish player selection cards"
          git push origin player-profiles-v1
