name: Player Profiles V1 UX

on:
  push:
    branches: [player-profiles-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-profiles-v1

      - name: Improve player selection UX
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/page.jsx')
          s = p.read_text()

          replacements = [
            ("{ id: 'p1', playerId: null, isProfile: false, name: 'Player 1', scores: {} },\n  { id: 'p2', playerId: null, isProfile: false, name: 'Player 2', scores: {} }", "{ id: 'p1', playerId: null, isProfile: false, isGuest: false, name: 'Player 1', scores: {} },\n  { id: 'p2', playerId: null, isProfile: false, isGuest: false, name: 'Player 2', scores: {} }"),
            ("isProfile: Boolean(row.players?.is_profile),\n      name: row.players?.display_name || `Player ${index + 1}`,", "isProfile: Boolean(row.players?.is_profile),\n      isGuest: !Boolean(row.players?.is_profile),\n      name: row.players?.display_name || `Player ${index + 1}`,"),
            ("function PlayerScoringRow({ player, result, totalScore, isLeader, hasHonours, openScore, updateName }) {", "function PlayerScoringRow({ player, result, totalScore, isLeader, hasHonours, openScore, updateName, choosePlayer }) {"),
            ("<input className=\"tbd-player-name-input\" aria-label={`${player.name} name`} value={player.name} readOnly={Boolean(player.isProfile)} title={player.isProfile ? 'Saved player profile' : 'Guest player'} onFocus={event => { if (!player.isProfile) event.target.select(); }} onChange={event => { if (!player.isProfile) updateName(player.id, event.target.value); }} />", "{player.isProfile ? <input className=\"tbd-player-name-input\" aria-label={`${player.name} saved profile`} value={player.name} readOnly title=\"Saved player profile\" /> : player.isGuest ? <input className=\"tbd-player-name-input\" aria-label={`${player.name} guest name`} value={player.name} title=\"Guest player\" onFocus={event => event.target.select()} onChange={event => updateName(player.id, event.target.value)} /> : <button type=\"button\" className=\"tbd-player-name-input\" onClick={() => choosePlayer(player.id)} style={{ textAlign: 'left', cursor: 'pointer' }} aria-label={`Choose ${player.name}`}>{player.name} · Choose player</button>}"),
            ("const [showPlayerProfiles, setShowPlayerProfiles] = useState(false);", "const [showPlayerProfiles, setShowPlayerProfiles] = useState(false);\n  const [playerPickerTargetId, setPlayerPickerTargetId] = useState(null);"),
            ("function updateName(playerId, name) { markRoundDirty(); setPlayers(current => current.map(player => player.id === playerId && !player.isProfile ? { ...player, name, playerId: null } : player)); }\n  function addPlayer() { setShowPlayerProfiles(true); }\n  function addGuest() { markRoundDirty(); setPlayers(current => [...current, { id: crypto.randomUUID(), playerId: null, isProfile: false, name: `Player ${current.length + 1}`, scores: {} }]); }", "function updateName(playerId, name) { markRoundDirty(); setPlayers(current => current.map(player => player.id === playerId && player.isGuest ? { ...player, name, playerId: null } : player)); }\n  function openPlayerPicker(playerId = null) { setPlayerPickerTargetId(playerId); setShowPlayerProfiles(true); }\n  function closePlayerPicker() { setShowPlayerProfiles(false); setPlayerPickerTargetId(null); }\n  function addPlayer() { openPlayerPicker(null); }\n  function choosePlayer(playerId) { openPlayerPicker(playerId); }\n  function addGuest() {\n    markRoundDirty();\n    setPlayers(current => {\n      if (playerPickerTargetId) return current.map(player => player.id === playerPickerTargetId ? { ...player, playerId: null, isProfile: false, isGuest: true, name: player.name, scores: player.scores || {} } : player);\n      return [...current, { id: crypto.randomUUID(), playerId: null, isProfile: false, isGuest: true, name: `Player ${current.length + 1}`, scores: {} }];\n    });\n    setPlayerPickerTargetId(null);\n  }"),
            ("if (current.some(player => player.playerId === profile.id)) return current;\n      const placeholderIndex = current.findIndex(player => !player.playerId && !player.isProfile && scoredHoleCount(player) === 0 && /^Player \\d+$/.test(player.name));\n      if (placeholderIndex >= 0) return current.map((player, index) => index === placeholderIndex ? { ...player, playerId: profile.id, isProfile: true, name: profile.display_name, scores: {} } : player);\n      return [...current, { id: crypto.randomUUID(), playerId: profile.id, isProfile: true, name: profile.display_name, scores: {} }];", "if (current.some(player => player.playerId === profile.id)) return current;\n      if (playerPickerTargetId) return current.map(player => player.id === playerPickerTargetId ? { ...player, playerId: profile.id, isProfile: true, isGuest: false, name: profile.display_name, scores: player.scores || {} } : player);\n      const placeholderIndex = current.findIndex(player => !player.playerId && !player.isProfile && !player.isGuest && scoredHoleCount(player) === 0);\n      if (placeholderIndex >= 0) return current.map((player, index) => index === placeholderIndex ? { ...player, playerId: profile.id, isProfile: true, isGuest: false, name: profile.display_name, scores: {} } : player);\n      return [...current, { id: crypto.randomUUID(), playerId: profile.id, isProfile: true, isGuest: false, name: profile.display_name, scores: {} }];"),
            ("    markRoundDirty();\n  }\n  function removePlayer()", "    markRoundDirty();\n    setPlayerPickerTargetId(null);\n  }\n  function removePlayer()"),
            ("openScore={setScoringPlayerId} updateName={updateName} />", "openScore={setScoringPlayerId} updateName={updateName} choosePlayer={choosePlayer} />"),
            ("<PlayerProfilesModal open={showPlayerProfiles} onClose={() => setShowPlayerProfiles(false)} onSelectProfile={addSavedProfile} onAddGuest={addGuest}", "<PlayerProfilesModal open={showPlayerProfiles} onClose={closePlayerPicker} onSelectProfile={addSavedProfile} onAddGuest={addGuest}")
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected source fragment: {old[:140]}')
            s = s.replace(old, new)

          p.write_text(s)

      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit UX fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.jsx
          git commit -m "Make player slots open saved player picker"
          git push origin player-profiles-v1
